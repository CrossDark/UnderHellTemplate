name: Publish to Typst Universe

# 触发条件:推送 v* 标签 或 手动触发
# Trigger: push v* tag or manual dispatch
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号(如 0.3.1,不带 v 前缀)"
        required: true
        default: "0.3.1"

permissions:
  contents: read

jobs:
  submit-pr:
    name: 提交 PR 到 typst/packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 模板
        uses: actions/checkout@v5

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # 从 tag 名去掉前导 v
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "解析到的版本号: ${{ steps.ver.outputs.version }}"

      - name: 校验 typst.toml 版本号一致
        shell: bash
        run: |
          EXPECTED="${{ steps.ver.outputs.version }}"
          ACTUAL=$(grep -E '^version' typst.toml | head -1 | sed -E 's/.*=\s*"([^"]+)".*/\1/')
          echo "typst.toml version = $ACTUAL, 期望 = $EXPECTED"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::typst.toml 中的版本号($ACTUAL)与触发版本($EXPECTED)不一致,请先更新 typst.toml"
            exit 1
          fi

      - name: Clone fork (CrossDark/packages)
        env:
          GH_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/CrossDark/packages.git /tmp/packages
          cd /tmp/packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 同步 fork 与上游
        run: |
          cd /tmp/packages
          git remote add upstream https://github.com/typst/packages.git
          git fetch --depth 1 upstream main
          # 以 upstream/main 为基底,避免 fork 落后导致 PR 冲突
          git checkout -b add-underhell-${{ steps.ver.outputs.version }} upstream/main

      - name: 放置包文件
        run: |
          DEST="/tmp/packages/packages/preview/underhell/${{ steps.ver.outputs.version }}"
          mkdir -p "$DEST"
          # 复制包根文件:typst.toml / lib.typ / README.md / LICENSE
          cp typst.toml lib.typ README.md LICENSE "$DEST/"
          # 复制资源目录:img(背景图等)、languages(语言配置)、example(示例)
          cp -r img languages example "$DEST/"
          # 删除可能的 .gitignore / 构建产物,包内不需要
          rm -f "$DEST/.gitignore" 2>/dev/null || true
          echo "=== 包内容 ==="
          ls -la "$DEST"

      - name: 提交并推送到 fork
        env:
          GH_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
        run: |
          cd /tmp/packages
          git add -A
          git commit -m "Add underhell@${{ steps.ver.outputs.version }}" || echo "无变更可提交(可能已存在)"
          git push -f origin add-underhell-${{ steps.ver.outputs.version }}

      - name: 创建 PR 到 typst/packages
        env:
          GH_TOKEN: ${{ secrets.TYPST_PACKAGES_TOKEN }}
        run: |
          cd /tmp/packages
          # 若已存在同分支的 PR 则跳过创建
          EXISTING=$(gh pr view \
            --repo typst/packages \
            --head CrossDark:add-underhell-${{ steps.ver.outputs.version }} \
            --json number --jq '.number' 2>/dev/null || true)
          if [[ -n "$EXISTING" ]]; then
            echo "已存在 PR #$EXISTING,跳过创建"
            exit 0
          fi
          gh pr create \
            --repo typst/packages \
            --base main \
            --head CrossDark:add-underhell-${{ steps.ver.outputs.version }} \
            --title "Add underhell@${{ steps.ver.outputs.version }}" \
            --body "$(cat <<EOF
          ## underhell@${{ steps.ver.outputs.version }}

          D&D 5E 风格的 Typst 文档模板,适用于冒险、属性方块、法术卡等内容。

          - 包名: \`underhell\`
          - 版本: \`${{ steps.ver.outputs.version }}\`
          - 入口: \`lib.typ\`
          - 许可: MIT
          - 仓库: https://github.com/CrossDark/UnderHellTemplate

          本包基于 [coljac/typst-dnd5e](https://github.com/coljac/typst-dnd5e)(即 \`dragonling\`)修改而来,感谢原作者 Colin Jacobs 的工作。

          ### 用法示例
          \`\`\`typst
          #import "@preview/underhell:${{ steps.ver.outputs.version }}": *
          #show: dndmodule.with(title: "My Adventure", author: "Me")
          \`\`\`

          此 PR 由 [UnderHellTemplate](https://github.com/CrossDark/UnderHellTemplate) 的 GitHub Action 自动创建。
          EOF
          )"
